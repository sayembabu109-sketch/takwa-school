<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal — তাক্বওয়া</title>
<style>body{margin:0;font-family:system-ui,Arial;background:#f3f6f8;color:#17202a}header{background:#123b2a;color:#fff;padding:18px}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:15px;margin:12px 0;box-shadow:0 3px 15px #0001}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{min-width:120px}button{padding:11px;background:#123b2a;color:#fff;border:0;border-radius:9px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none}</style></head>
<body><header><div class="wrap"><h1>Student Portal</h1><p>তাক্বওয়া ইন্টারন্যাশনাল ইসলামিক স্কুল</p></div></header><div class="wrap">
<div id="app" class="card">Loading...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(TAKWA_CONFIG.SUPABASE_URL,TAKWA_CONFIG.SUPABASE_KEY);let me;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.href='login.html';const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();if(!p||p.role!=='student')return location.href='login.html';me=p;draw()}
async function draw(){const [r,a,rt,n]=await Promise.all([sb.from('results').select('*').eq('student_id',me.id).order('created_at',{ascending:false}),sb.from('attendance').select('*').eq('student_id',me.id).order('attendance_date',{ascending:false}),sb.from('routines').select('*').eq('class_name',me.class_name),sb.from('notices').select('*').order('published_at',{ascending:false})]);app.innerHTML=`<h2>আসসালামু আলাইকুম, ${esc(me.full_name)}</h2><p>Student ID: ${esc(me.student_id)} | Class: ${esc(me.class_name)} | Roll: ${esc(me.roll)}</p><div class="tabs"><button onclick="box('res')">Result</button><button onclick="box('att')">Attendance</button><button onclick="box('rou')">Routine</button><button onclick="box('not')">Notice</button><button onclick="logout()">Logout</button></div><div id="content" class="card"></div>`;window.DATA={r:r.data||[],a:a.data||[],rt:rt.data||[],n:n.data||[]};box('res')}
function box(x){let h='';if(x==='res')h='<h3>📊 Result</h3><table><tr><th>Exam</th><th>Subject</th><th>Marks</th></tr>'+DATA.r.map(v=>`<tr><td>${esc(v.exam_name)}</td><td>${esc(v.subject)}</td><td>${v.marks}</td></tr>`).join('')+'</table>';if(x==='att')h='<h3>✅ Attendance</h3><table><tr><th>Date</th><th>Status</th></tr>'+DATA.a.map(v=>`<tr><td>${v.attendance_date}</td><td>${esc(v.status)}</td></tr>`).join('')+'</table>';if(x==='rou')h='<h3>🕐 Routine</h3><table><tr><th>Day</th><th>Period</th><th>Subject</th><th>Teacher</th></tr>'+DATA.rt.map(v=>`<tr><td>${esc(v.day_name)}</td><td>${v.period_no}</td><td>${esc(v.subject)}</td><td>${esc(v.teacher)}</td></tr>`).join('')+'</table>';if(x==='not')h=DATA.n.map(v=>`<div class="card"><b>${esc(v.title)}</b><p>${esc(v.body)}</p></div>`).join('');content.innerHTML=h||'কোনো তথ্য নেই।'}
async function logout(){await sb.auth.signOut();location.href='login.html'}boot();
</script></body></html>
